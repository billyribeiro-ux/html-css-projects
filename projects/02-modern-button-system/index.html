<body>
  <main class="page-container">
    <header class="page-header">
      <span class="badge">Level 02 • Distinguished Principal Engineer L8++</span>
      <h1 class="page-title">Enterprise Action Component Architecture</h1>
      <p class="page-desc">
        Engineered with OKLCH dynamic gamut blending via <code>color-mix()</code>, CSS Nesting, sub-millisecond tactile feedback, and strict WCAG 2.2 AAA keyboard focus rings.
      </p>
    </header>

    <!-- Component Matrix -->
    <section class="showcase-card">
      <h2 class="section-title">Core Intent Variants</h2>
      <div class="button-grid">
        <button type="button" class="btn btn-primary">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
          <span>Primary Action</span>
        </button>

        <button type="button" class="btn btn-secondary">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          <span>Secondary Action</span>
        </button>

        <button type="button" class="btn btn-soft">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>Soft Neutral</span>
        </button>

        <button type="button" class="btn btn-outline">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Outline Subtle</span>
        </button>

        <button type="button" class="btn btn-danger">
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
          <span>Destructive</span>
        </button>

        <button type="button" class="btn btn-ghost">
          <span>Ghost Action</span>
          <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>
    </section>

    <!-- State & Size Matrix -->
    <section class="showcase-card">
      <h2 class="section-title">Scale Tokens & Dynamic States</h2>
      <div class="button-grid items-center">
        <!-- Small -->
        <button type="button" class="btn btn-primary btn-sm">Small (32px)</button>
        <!-- Medium (Default) -->
        <button type="button" class="btn btn-primary">Standard (40px)</button>
        <!-- Large -->
        <button type="button" class="btn btn-primary btn-lg">Large Hero (48px)</button>
        <!-- Loading -->
        <button type="button" class="btn btn-primary is-loading" aria-busy="true">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span>Deploying Cluster...</span>
        </button>
        <!-- Disabled -->
        <button type="button" class="btn btn-primary" disabled>
          <span>Disabled State</span>
        </button>
        <!-- Icon Only -->
        <button type="button" class="btn btn-secondary btn-icon-only" aria-label="Quick Bookmark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
        </button>
      </div>
    </section>
