<body>
  <main class="page-container">
    <header class="page-header">
      <div class="badge-row">
        <span class="badge">Level 27 • Distinguished Principal Engineer L8++</span>
        <span class="tech-tag">Web Audio API & Canvas2D</span>
      </div>
      <h1 class="page-title">Interactive Canvas Spectrum & Audio Synthesizer</h1>
      <p class="page-desc">
        Zero external audio libraries. Native browser <code>AudioContext</code> synthesizing waveforms in real time, analyzed via <code>AnalyserNode</code>, and rendered at 120fps on an optimized HTML5 Canvas.
      </p>
    </header>

    <div class="synth-console">
      <!-- 120fps Canvas Spectrum Visualizer -->
      <div class="canvas-wrapper">
        <canvas id="spectrum-canvas" width="800" height="240"></canvas>
      </div>

      <!-- Synthesizer Controls -->
      <div class="synth-controls">
        <div class="control-row">
          <div class="btn-group" role="group" aria-label="Waveform type">
            <button type="button" class="btn-wave active" data-wave="sine">Sine</button>
            <button type="button" class="btn-wave" data-wave="triangle">Triangle</button>
            <button type="button" class="btn-wave" data-wave="sawtooth">Sawtooth</button>
            <button type="button" class="btn-wave" data-wave="square">Square</button>
          </div>

          <button type="button" class="btn btn-power" id="btn-power">
            <span class="power-glyph">⏻</span>
            <span id="power-text">Initialize Audio Engine</span>
          </button>
        </div>

        <div class="sliders-grid">
          <div class="slider-field">
            <label for="freq-slider">
              <span>Oscillator Frequency:</span>
              <output id="freq-out">440 Hz (A4)</output>
            </label>
            <input type="range" id="freq-slider" min="110" max="880" value="440" class="custom-slider">
          </div>

          <div class="slider-field">
            <label for="gain-slider">
              <span>Master Gain (Volume):</span>
              <output id="gain-out">20%</output>
            </label>
            <input type="range" id="gain-slider" min="0" max="100" value="20" class="custom-slider">
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
