name: DPE L8++ CI & Verification Matrix

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python for Master Dataset Build
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Install Playwright Browsers & OS Dependencies
        run: npx playwright install --with-deps

      - name: Verify Master Dataset Compilation
        run: npm run data:build

      - name: Run Vitest Unit & Architecture Tests
        run: npm run test:coverage

      - name: Build Multi-Page Production Assets
        run: npm run build

      - name: Run Playwright Multi-Browser E2E Tests
        run: npm run test:e2e

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
